<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>

    <!-- Logo -->
    <img id="logo" src="https://github.com/devtlv/studentsGitHub/blob/master/JS/Week%205/Day%205/Mini%20Projects/Mini-Project%202%20-%20Pokedex%20API/logo.png?raw=true" alt="Pokemon logo">

    <!-- Pokedex principal -->
    <div id="pokedex">

        <!-- Zone où l’image du Pokémon apparaîtra -->
        <div id="pokemonDisplay">
            <img id="pokemonImage" src="https://github.com/devtlv/studentsGitHub/blob/master/JS/Week%205/Day%205/Mini%20Projects/Mini-Project%202%20-%20Pokedex%20API/pokedex.png?raw=true" alt="Pokemon">
        </div>

        <p id="loading"></p>
        <!-- Zone des informations -->
        <div id="pokemonInfo">
            <h2 id="pokemonName"></h2>
            <p id="pokemonId"></p>
            <p id="pokemonHeight"></p>
            <p id="pokemonWeight"></p>
            <p id="pokemonType"></p>
        </div>

        <!-- Boutons -->
        <button id="previous">Previous</button>
        <button id="random">Random</button>
        <button id="next">Next</button>

    </div>

    <script src="script.js"></script>
</body>
   
</html>
