<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Wars Characters</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome pour l'icône de chargement -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    >
</head>

<body>

    <div class="wrapper">

        <div class="logo"></div>

        <div class="info-container">

            <h1 id="name">Click the button to find a character</h1>

            <p id="height"></p>
            <p id="gender"></p>
            <p id="birth-year"></p>
            <p id="home-world"></p>

        </div>

        <button type="button" id="button">
            Find Someone
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
