<body>
    <script>
 function compareToTen(number){

    return new Promise((resolve, reject)=>{

        if(number <= 10){
            resolve("Le nombre est inférieur ou égal à 10");
        }
        else{
            reject("Le nombre est supérieur à 10");
        }

    });

}

    </script>
